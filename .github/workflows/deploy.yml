name: CI/CD for ASP.NET Core

on:
  push:
    branches:
      - main  # Thay đổi nếu branch chính của bạn khác

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # Thay bằng phiên bản .NET của bạn
      
      - name: Restore Dependencies
        run: dotnet restore
        working-directory: ./HimariServer

      - name: Build Application
        run: dotnet build --configuration Release --no-restore
        working-directory: ./HimariServer

      - name: Run Tests
        run: dotnet test --configuration Release --no-build --verbosity normal
        working-directory: ./HimariServer

      - name: Publish Application
        run: dotnet publish -c Release -o publish
        working-directory: ./HimariServer

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Download Artifact
        uses: actions/download-artifact@v3
        with:
          name: app
          path: app

      - name: Deploy to Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key && chmod 600 private_key
          scp -r -o StrictHostKeyChecking=no -i private_key app $SERVER_USER@$SERVER_IP:/var/www/app
          ssh -o StrictHostKeyChecking=no -i private_key $SERVER_USER@$SERVER_IP << 'EOF'
            cd /var/www/app
            sudo systemctl restart kestrel-app
          EOF
